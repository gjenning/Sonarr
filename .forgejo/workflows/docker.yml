name: Docker

# Required repo/org settings:
#   vars.REGISTRY_HOST   - container registry host of the Forgejo instance,
#                          e.g. registry.example.com (or the main domain if the
#                          registry is served there)
#   secrets.REGISTRY_USER - username for the registry (usually the repo owner)
#   secrets.REGISTRY_TOKEN - password/token with package write access

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    tags: ["v*.*.*", "v*.*"]

env:
  REGISTRY: ${{ vars.REGISTRY_HOST }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
